<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU GOURMAND</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #1a0000 100%);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff0000;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .container {
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 50px;
            max-width: 800px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.4);
            text-align: center;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 0, 0, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(255, 0, 0, 0.9); }
        }

        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            animation: intenseglow 1s ease-in-out infinite;
            letter-spacing: 5px;
        }

        @keyframes intenseglow {
            0%, 100% { 
                text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000, 0 0 120px #ff0000;
                transform: scale(1.05);
            }
        }

        .warning {
            color: #ffff00;
            margin: 30px 0;
            font-size: 1.5em;
            animation: urgentblink 0.5s infinite;
            font-weight: bold;
            text-shadow: 0 0 10px #ffff00;
        }

        @keyframes urgentblink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        .status-box {
            margin: 30px 0;
            padding: 25px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 10px;
            font-size: 1.2em;
        }

        .status-box p {
            margin: 10px 0;
        }

        .cpu-meter {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ff0000;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .cpu-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000 0%, #ff6600 50%, #ffff00 100%);
            width: 0%;
            animation: fillup 2s ease-out forwards, pulsate 1s ease-in-out infinite 2s;
            box-shadow: 0 0 20px #ff0000;
        }

        @keyframes fillup {
            from { width: 0%; }
            to { width: 100%; }
        }

        @keyframes pulsate {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-back {
            background: linear-gradient(135deg, #660000 0%, #330000 100%);
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #880000 0%, #440000 100%);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff0000;
            border-radius: 50%;
            animation: float 4s linear infinite;
            box-shadow: 0 0 10px #ff0000;
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1);
            }
        }

        .execution-log {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff0000;
            border-radius: 5px;
            font-size: 0.9em;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        .log-line {
            margin: 5px 0;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1>🔥 CPU GOURMAND 🔥</h1>
        
        <div class="warning">
            ⚠️⚠️⚠️ EXTREME CPU OVERLOAD ⚠️⚠️⚠️
        </div>

        <div class="status-box">
            <p><strong>Status:</strong> <span id="status">INITIALIZING...</span></p>
            <p><strong>Mode:</strong> 20x Force 2.0 Intensity</p>
            <p><strong>Iterations:</strong> 10,000,000 exponential calculations</p>
            <p><strong>Parallel Threads:</strong> 8 goroutines</p>
            <p><strong>CPU Target:</strong> MAXIMUM SATURATION</p>
        </div>

        <div class="cpu-meter">
            <div class="cpu-fill"></div>
        </div>

        <div class="execution-log" id="executionLog">
            <div class="log-line">🚀 System initialized...</div>
            <div class="log-line">⚡ Preparing CPU overload...</div>
        </div>

        <a href="/" class="btn-back">← RETOUR À L'ACCUEIL</a>
    </div>

    <script>
        // Créer des particules animées
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // Fonction pour ajouter des logs
        function addLog(message) {
            const logContainer = document.getElementById('executionLog');
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            logLine.textContent = message;
            logContainer.appendChild(logLine);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Lancer automatiquement l'exécution au chargement de la page
        window.addEventListener('load', async () => {
            const statusEl = document.getElementById('status');
            
            addLog('🔥 Starting CPU GOURMAND execution...');
            statusEl.textContent = 'EXECUTING...';
            statusEl.style.color = '#ff6600';

            try {
                const startTime = Date.now();
                
                const response = await fetch('/gourmand/execute', {
                    method: 'POST'
                });

                if (response.ok) {
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                    statusEl.textContent = 'COMPLETED ✓';
                    statusEl.style.color = '#00ff00';
                    addLog(`✅ Execution completed in ${elapsed}s`);
                    addLog('📊 CPU saturation successful');
                    addLog('🔥 Server metrics spiked');
                    
                    // Optionnel: redirection automatique après 5 secondes
                    setTimeout(() => {
                        addLog('↩️ Redirecting to home...');
                        window.location.href = '/';
                    }, 5000);
                } else {
                    throw new Error('Execution failed');
                }
            } catch (error) {
                statusEl.textContent = 'ERROR ✗';
                statusEl.style.color = '#ffff00';
                addLog('❌ Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
